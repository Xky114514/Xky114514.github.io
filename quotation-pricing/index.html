{cat:'terms',title:'约定与条件',value:i===1?'固定价 7.60 元/斤；10月1日—31日':'暂无已核实固定价；其他业务条件待确认',certainty:i===1?'已核实事实':'待核实信息',impact:i===1?'须遵循协议价':'暂无法判断',constraint:i===1?'有效约束':'约束待核实',source:i===1?'固定价协议 A-018':'业务条件记录 / 企微补充',date:i===1?'09-25':'09-29',scope:q().name+' / '+x.name+' / '+x.spec,more:'数量阶梯、时价、适用时段和原系统限制均需核对。消息、建议或手填新价不使协议自动变更。'}];}
function evidenceHTML(){const cats=[['key','关键'],['all','全部'],['cost','采购'],['history','历史'],['market','市场'],['merchant','商户'],['terms','约定']];let items=evidenceItems();if(view.factor==='key')items=items.filter(x=>(view.product===1?['terms','cost']:['cost','market','merchant']).includes(x.cat));else if(view.factor!=='all')items=items.filter(x=>x.cat===view.factor);return `<div class="factor-nav" aria-label="依据类别">${cats.map(([id,name])=>`<button data-factor="${id}" aria-pressed="${view.factor===id}">${name}</button>`).join('')}</div>`+items.map(x=>`<article class="evidence-card ${x.cat==='market'&&view.product===0&&b().excluded?'excluded':''}"><div class="flex spread"><h3>${x.title}</h3>${x.cat==='market'&&view.product===0?`<button class="link" data-action="toggle-market">${b().excluded?'恢复参考':'排除此条'}</button>`:''}</div><p>${esc(x.value)}${x.cat==='market'&&view.product===0&&b().excluded?'（已排除）':''}</p><div class="evidence-tags">${tag(x.certainty,x.certainty==='待核实信息'?'amber':'')}${tag(x.impact)}${tag(x.constraint,x.constraint==='有效约束'?'green':'')}</div><details><summary>来源与口径 · ${x.date}</summary><p>来源：${x.source}<br>适用：${x.scope}<br>时间：2026-${x.date}<br>${x.more}</p></details></article>`).join('');}
function decisionHTML(){const i=view.product,x=p(),value=b().prices[i],f=flags(i);return `<div class="price-label">负责人最终价</div><div class="final-value">${value?money(value):'未定价'}${value?'<small class="small muted"> 元/斤</small>':''}</div><div style="margin-top:7px">${tag(b().methods[i]||'可直接填写')}${b().stage?' '+tag('已确认版本','green'):''}</div>${f?`<div class="notice-box ${f.type==='conflict'?'red':''}" style="margin-top:18px"><strong>${f.label}</strong><p>${f.type==='conflict'?'请按现有协议报价；如需改约，须核实双方确认的生效材料。':f.type==='review'?'新信息已更新建议，原定价格保留，请复核。':'允许保留这个价格；AI 原区间不会因此改变。'}</p></div>`:''}<div class="decision-calcs"><div><span class="label">较当前价</span><strong>${value?signed((cents(value)-cents(x.current))/100):'—'}</strong></div><div><span class="label">采购成本价差</span><strong>${value?signed((cents(value)-cents(x.cost))/100):'—'}</strong></div></div><details class="disclosure"><summary>计算口径与已知影响</summary><div class="body"><p>价差 = 最终价 − 当前价；采购成本价差 = 最终价 − 采购参考成本。按分计算后换算为元。</p><p>未扣损耗、配送等费用；该价差不是净利润。</p>${value?`<p>较当前价：${((cents(value)-cents(x.current))/cents(x.current)*100).toFixed(1)}%。${f?.type==='deviation'?'区间外价格的客户接受程度仍需核实。':''}</p>`:''}</div></details><label class="field" style="margin-top:13px"><span>经营考虑（选填）</span><textarea id="decision-note" rows="2" placeholder="也可直接在“讨论”里补充" ${b().stage?'disabled':''}>${esc(b().notes[i]||'')}</textarea></label>${b().needsReview[i]?'<button class="btn" style="margin-top:14px" data-action="keep-price">复核并保留此价格</button>':''}`;}
function welcome(){const x=p();if(x.kind==='fixed')return '<strong>这项按有效协议报价</strong><p>适用价为 7.60 元/斤。需要调价时，可先讨论改约草案。</p>';if(x.kind==='missing'||(x.kind==='normal'&&b().excluded))return '<strong>目前不生成区间</strong><p>现有参考点已保留。补齐可比资料后，再讨论具体价格。</p>';if(x.kind==='wide')return '<strong>先确认最影响价格的条件</strong><p>本次是每日配送，还是集中配送？</p>';if(b().merchantChanged)return '<strong>商户条件已更新</strong><p>采购量下降与配送要求需要重新核实，暂不推荐具体点价。</p>';return '<strong>大白菜先考虑 5.10 元/斤</strong><p>成本上涨支持调价，稳定采购关系支持控制涨幅。</p>';}
function chatHTML(){const messages=b().discussion.filter(m=>m.product===view.product);return `<div class="chat-status">围绕当前商品讨论 · 演示回复</div><div class="chat-list" aria-live="polite"><div class="bubble">${welcome()}</div>${messages.slice(-10).map(m=>`<div class="bubble ${m.role==='user'?'user':''}">${m.role==='user'?esc(m.text):m.html}${m.price?`<button class="btn" style="margin-top:10px" data-chat-price="${m.price}" data-product="${m.product}" data-context="${view.quote}">填写 ${money(m.price)}</button>`:''}</div>`).join('')}</div><div class="chat-quick"><button class="btn slim" data-action="explain">解释建议</button><button class="btn slim" data-action="questions">还缺什么</button>${view.product===0?'<button class="btn slim" data-action="toggle-market">'+(b().excluded?'恢复行情':'排除行情')+'</button>':''}</div><form class="chat-form" id="chat-form"><label class="sr-only" for="chat-input">补充信息或指定价格</label><textarea id="chat-input" rows="2" placeholder="例如：这项报 5.40"></textarea><div class="flex spread"><small class="muted">已定价格不会被覆盖</small><button class="btn primary" type="submit">发送</button></div></form>`;}
function questionHTML(){const kind=p().kind;const list=kind==='normal'?['客户能否接受 0.10 元/斤的上涨？','市场报价是否与本次规格、配送条件一致？']:kind==='fixed'?['本次是否满足协议的规格及有效期？','改约是否已有双方确认的生效材料？']:kind==='missing'?['有没有同规格、同等级的可比报价？','本批次的已知损耗是多少？']:['本次是每日配送，还是集中配送？','商品是否仍按一级规格执行？'];return '<strong>本轮确认这两项</strong><ol>'+list.map(t=>'<li>'+t+'</li>').join('')+'</ol>';}
function changeMarket(){if(view.product!==0)return;if(b().stage){requestRevise({type:'market',product:view.product,quote:view.quote,label:b().excluded?'恢复大白菜行情参考':'排除大白菜行情'});return;}b().sequence++;b().excluded=!b().excluded;if(b().prices[0])b().needsReview[0]=true;b().discussion.push({product:0,role:'assistant',html:b().excluded?'<strong>已排除这条行情</strong><p>区间与倾向价暂时撤回，保留采购成本和历史参考点。已定价格不变。</p>':'<strong>行情已恢复参考</strong><p>请继续核实规格与适用条件，负责人价格保持不变。</p>'});b().messages.push({role:'assistant',kind:'text',html:'<p>大白菜行情'+(b().excluded?'已排除，暂不形成区间':'已恢复参考')+'。已定价格保持不变。</p>'});save();render();toast('仅更新大白菜的依据和建议，已填报价保留。');}
function sendChat(text){if(b().stage&&view.product===0&&/排除|别参考|规格不同|采购量.*下降|每天配送|每日配送/.test(text)){requestRevise({type:'chat',product:view.product,quote:view.quote,text,label:'补充依据：'+text});return;}b().discussion.push({product:view.product,role:'user',text});if(/排除|别参考|规格不同/.test(text)&&view.product===0){if(!b().excluded)changeMarket();else addMessage('<p>这条行情已处于排除状态。</p>');return;}if(/采购量.*下降|每天配送|每日配送/.test(text)&&view.product===0){b().sequence++;b().merchantChanged=true;if(b().prices[0])b().needsReview[0]=true;addMessage('<strong>商户情况已补充</strong><p>标记为人员转述、待核实。原范围保留，但暂不推荐具体点价；不将经营条件机械换算成加价。</p><p>你的最终价保持不变。</p>');return;}const match=text.match(/(?:报|定|价格(?:为|是)?|价为|价是)\s*[¥￥]?\s*(\d+(?:\.\d{1,2})?)(?!\d|\.)/);if(match&&Number(match[1])>0){b().discussion.push({product:view.product,role:'assistant',html:'<strong>按你的决定填写</strong><p>这会修改草稿中的具体价格，AI 原建议保持不变。</p>',price:Number(match[1])});save();render();return;}if(/为什么|解释|建议/.test(text)){addMessage(welcome()+'<p class="small">区间上下沿、取舍和参考来源可在“AI 建议”和“客观依据”中查看。</p>');return;}if(/缺|确认|问题/.test(text)){addMessage(questionHTML());return;}addMessage('<strong>已记录这条补充</strong><p>信息暂列为待核实，本演示不会据此编造新价格。实际产品需核实来源后更新受影响商品。</p>');}
function openDialog(type,title,html,footer){dialogFocus=document.activeElement;dialogType=type;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#dialog-foot').innerHTML=footer;$('#dialog-cover').hidden=false;document.body.style.overflow='hidden';$('#dialog-cover [data-action="close-dialog"]').focus();}
function closeDialog(){$('#dialog-cover').hidden=true;dialogType='';if(!view.drawer&&!view.sheet)document.body.style.overflow='';if(dialogFocus?.isConnected)dialogFocus.focus();}
const cancel='<button class="btn" data-action="close-dialog">返回</button>';
function unresolved(){const list=[];for(const i of q().items){const x=products[i];if(x.kind==='normal')list.push('大白菜：'+(b().excluded?'行情已排除，区间暂缺。':b().merchantChanged?'采购量与配送要求变化待核实。':'客户接受程度、行情规格待核实。'));if(x.kind==='missing')list.push('土豆：可比规格与损耗信息不足。');if(x.kind==='wide')list.push('西红柿：配送频次、等级待确认。');}return list;}
function review(){if(b().stage===1){executionDialog();return;}if(b().stage>=2){verificationDialog();return;}const empty=q().items.filter(i=>!b().prices[i]),conflicts=q().items.filter(i=>flags(i)?.type==='conflict'),changed=q().items.filter(i=>b().needsReview[i]);const blocked=empty.length||conflicts.length||changed.length;openDialog('review','确认本版报价',`<div class="flex spread wrap"><div><strong>${q().name}</strong><div class="small muted">v${b().version} · 10月1日—7日 · 含税元/斤</div></div><button class="link" data-action="review-conditions">适用条件</button></div><table><thead><tr><th>商品</th><th>当前价</th><th>最终价</th><th>提示</th></tr></thead><tbody>${q().items.map(i=>`<tr><td>${products[i].name}<br><small class="muted">${products[i].spec}</small></td><td>${money(products[i].current)}</td><td><strong>${b().prices[i]?money(b().prices[i]):'未填写'}</strong></td><td>${flags(i)?esc(flags(i).label):esc(b().methods[i]||'待决定')}</td></tr>`).join('')}</tbody></table><div class="small muted">仅影响 ${q().name}；适用本单所列规格。鲜鸡蛋如适用协议 A-018，仍受 7.60 元/斤固定价约束。</div><div class="review-issues"><strong>未解决项</strong><ul>${unresolved().map(t=>'<li>'+t+'</li>').join('')}</ul></div>${empty.length?'<div class="error">'+empty.length+' 项尚未填写具体价格。</div>':''}${conflicts.length?'<div class="error">鸡蛋报价与有效协议冲突。请使用协议价，或核实变更生效后创建修订版；勾选知悉不能消除约束。</div>':''}${changed.length?'<div class="error">新依据影响的价格待复核，请到“我的决定”中确认。</div>':''}<label class="checkline" style="margin-top:18px"><input id="confirm-checked" type="checkbox"><span>我已检查具体价格、适用条件与未解决项，确认 v${b().version}。</span></label><div id="dialog-error" class="error" role="alert"></div>`,cancel+`<button class="btn primary" data-action="confirm-version" ${blocked?'disabled':''}>确认 v${b().version}</button>`);}
function confirmVersion(){if(!$('#confirm-checked').checked){$('#dialog-error').textContent='请先确认已检查本版报价。';return;}const book=b();book.history.push({version:book.version,time:new Date().toLocaleString('zh-CN'),prices:{...book.prices},methods:{...book.methods},notes:{...book.notes},evidence:{excluded:book.excluded,merchantChanged:book.merchantChanged},unresolved:unresolved(),conditions:'10月1日—7日 / 含税元/斤 / 本单所列规格',execution:null,checkAttempts:[],verified:null});book.stage=1;registerConfirmedStrategy(book,view.quote);save();closeDialog();closeDrawer();render();toast('本版已保存为报价策略；可在策略页设置生效时间，并继续人工落实。');}
function executionDialog(){const e=b().execution||{};openDialog('execution','记录人工落实',`<div class="subtle-box"><strong>${q().name} · v${b().version}</strong><p class="small muted">在原系统完成本版录入后，记录实际执行信息。</p></div><div class="two-cols" style="margin-top:20px"><label class="field"><span>执行人员</span><input id="executor" value="${esc(e.person||'')}" placeholder="填写姓名"></label><label class="field"><span>原系统记录号</span><input id="order-id" value="${esc(e.order||'')}" placeholder="报价单或订单编号"></label><label class="field"><span>实际落实时间</span><input id="execution-time" type="datetime-local" value="${esc(e.time||'')}"></label></div><label class="checkline" style="margin-top:20px"><input id="execution-checked" type="checkbox"><span>已在原系统人工录入 v${b().version}，下一步核验实际录单。</span></label><div id="dialog-error" class="error" role="alert"></div>`,`<button class="btn" data-action="revise">创建修订版</button>`+cancel+'<button class="btn primary" data-action="save-execution">记录落实</button>');}
function saveExecution(){const person=$('#executor').value.trim(),order=$('#order-id').value.trim(),time=$('#execution-time').value;if(!person||!order||!time||!$('#execution-checked').checked){$('#dialog-error').textContent='请填写执行信息，并确认已在原系统录入。';return;}b().execution={person,order,time};const h=b().history.find(h=>h.version===b().version);h.execution={...b().execution};b().stage=2;save();closeDialog();render();toast('落实记录已保存，请继续核验实际录单。');}
function verificationDialog(){const done=b().stage===3,e=b().execution;openDialog('verify',done?'本版核验结果':'核验实际录单',`<div class="subtle-box"><strong>${q().name} · v${b().version}</strong><p class="small muted">${esc(e.person)} · ${esc(e.order)} · ${esc(e.time.replace('T',' '))}</p></div><table><thead><tr><th>商品</th><th>确认价</th><th>实际录单价</th></tr></thead><tbody>${q().items.map(i=>`<tr><td>${products[i].name}<br><small class="muted">${products[i].spec} · 元/斤</small></td><td>${money(b().prices[i])}</td><td><input class="price" data-actual="${i}" type="number" min="0.01" step="0.01" placeholder="实际价" value="${esc(b().actual[i]||'')}" aria-label="${products[i].name}实际录单价" ${done?'disabled':''}></td></tr>`).join('')}</tbody></table>${done?'<div class="notice-box" style="background:var(--green-soft);color:var(--green)">价格及适用条件已核对一致。</div>':'<label class="checkline"><input id="order-checked" type="checkbox"><span>商户、规格、计价单位、税价和适用日期已核对。</span></label>'}<div class="error" id="dialog-error" role="alert"></div>`,`<button class="btn" data-action="revise">创建修订版</button>`+cancel+(done?'':'<button class="btn primary" data-action="save-verification">核对并记录</button>'));}
function saveVerification(){const inputs=$$('[data-actual]'),book=b();if(inputs.some(el=>!el.value||!Number.isFinite(Number(el.value))||Number(el.value)<=0||Math.abs(Number(el.value)*100-cents(el.value))>.00001)||!$('#order-checked').checked){$('#dialog-error').textContent='请填写有效实际价格，并核对适用条件。';return;}for(const el of inputs)book.actual[el.dataset.actual]=money(el.value);const differences=q().items.filter(i=>cents(book.actual[i])!==cents(book.prices[i]));const attempt={time:new Date().toLocaleString('zh-CN'),actual:{...book.actual},differences:[...differences]};book.checkAttempts.push(attempt);const h=book.history.find(h=>h.version===book.version);h.checkAttempts.push(attempt);if(differences.length){save();$('#dialog-error').textContent='存在差异：'+differences.map(i=>products[i].name).join('、')+'。请回原系统更正后重验，或创建修订版重新确认。';return;}h.verified={...attempt,conditionsChecked:true};book.stage=3;save();closeDialog();render();toast('本版录单核验完成，落实与核验记录已保留。');}
function requestRevise(change=null){if(!b().stage){closeDialog();return;}revisionAction=change;openDialog('revise','创建修订版',`<div class="stack"><p>保留 v${b().version} 的价格、依据、落实与核验记录。</p><div class="subtle-box">新建 v${b().version+1} 草稿，沿用现有价格；调整后需要重新确认、落实与核验。</div>${change?'<div class="notice-box">新草稿将执行：'+esc(change.label)+'。<br>已定价格保持不变。</div>':''}</div>`,cancel+`<button class="btn primary" data-action="create-revision">创建 v${b().version+1}</button>`);}

function oeCategorySummary(category,records){
  const total=q().items.length;
  if(category==='cost')return {headline:total+' 项商品有采购参考',detail:'损耗、配送等成本仍需逐项补齐'};
  if(category==='history')return {headline:total+' 项商品有历史记录',detail:'按商品对照当前价与近期成交'};
  if(category==='market'){
    const excluded=records.filter(r=>r.excluded).length;
    const available=records.filter(r=>!r.excluded&&!r.value.startsWith('暂无')).length;
    return {headline:available+' 项有市场资料'+(excluded?' · '+excluded+' 项已排除':''),detail:'规格、等级与配送条件须逐项核实'};
  }
  if(category==='merchant'){
    const known=records.filter(r=>!r.value.includes('待确认')).length;
    return {headline:known+' 项有经营情况补充',detail:'其余 '+(total-known)+' 项待确认；不直接折算加减价'};
  }
  const constrained=records.filter(r=>r.constraint==='有效约束').length;
  return {headline:constrained?constrained+' 项有有效协议约束':'暂无已核实固定价约束',detail:(total-constrained)+' 项其他业务条件待核实'};
}

 const error=scheduleValidation(qi,s,candidate);if(error){$('#dialog-error').textContent=error;return;}
 if(candidate.enabled&&!$('#strategy-conditions').checked){$('#dialog-error').textContent='启用前请核对协议及业务条件。';return;}
 if(s.enabled&&!candidate.enabled){strategyPending={qi,id,candidate,conflicts:[]};openDialog('strategy-disable-edit','确认停用策略',`<p>保存后将${strategyStatus(s)==='生效中'?'立即停止':'取消计划启用'}「${esc(s.name)}」，本客户可能出现没有生效策略的时段。</p><p class="small muted">此前的时间与价格保留在历史中；停用后如需恢复，请复制新策略。</p>`,cancel+'<button class="btn primary" data-strategy-action="commit-schedule">确认停用并保存</button>');return;}
 const conflicts=candidate.enabled?scheduleConflicts(qi,candidate,id):[];strategyPending={qi,id,candidate,conflicts:conflicts.map(x=>x.id)};
 if(conflicts.length){showStrategyConflict(s,conflicts);return;}commitStrategySchedule();
}
function showStrategyConflict(s,conflicts){const {candidate}=strategyPending;
 openDialog('strategy-conflict','生效时间冲突',`<p>「${esc(s.name)}」与以下策略的时间重叠：</p><div class="strategy-conflicts">${conflicts.map(other=>`<div><strong>${esc(other.name)}</strong><p>${strategyRange(other)}</p><small>${strategyTime(other.start)<strategyTime(candidate.start)?'旧策略将于 '+strategyDate(candidate.start)+' 提前结束':'将取消该策略的启用安排'}</small></div>`).join('')}</div><p class="small muted">只影响 ${quotes[strategyPending.qi].name}。替换后不会自动恢复旧策略，已发生记录保留。</p><div class="error" id="dialog-error" role="alert"></div>`,cancel+'<button class="btn primary" data-strategy-action="commit-schedule">确认替换并启用</button>');
}
function commitStrategySchedule(){
 if(!strategyPending)return;const {qi,id,candidate,conflicts}=strategyPending,s=strategyFind(qi,id);if(!s)return;
 if(candidate.startNow&&!s.enabled)candidate.start=strategyInput(strategyClock());
 const error=scheduleValidation(qi,s,candidate);if(error){toast(error);return;}
 const live=candidate.enabled?scheduleConflicts(qi,candidate,id):[];
 if(JSON.stringify(live.map(x=>x.id).sort())!==JSON.stringify([...conflicts].sort())){strategyPending.conflicts=live.map(x=>x.id);if(live.length){showStrategyConflict(s,live);return;}}
 // All validation completes before any strategy is changed.
 for(const old of live){const previous=strategyRange(old);if(strategyTime(old.start)<strategyTime(candidate.start))old.end=candidate.start;else{old.enabled=false;old.stoppedAt=strategyInput(strategyClock());}strategyEvent(old,'被「'+s.name+'」替换；原安排 '+previous+'；'+(old.enabled?'提前结束于 '+strategyDate(old.end):'取消启用'));}
 const previous=strategyRange(s),wasEnabled=s.enabled;
 if(wasEnabled&&!candidate.enabled){s.enabled=false;s.stoppedAt=strategyInput(strategyClock());strategyEvent(s,'手动停用；原安排 '+previous);}
 else{Object.assign(s,candidate);if(candidate.enabled&&candidate.periodReconfirmed)s.periodAcceptance={start:candidate.start,end:candidate.end,at:strategyInput(strategyClock())};else delete s.periodAcceptance;strategyEvent(s,(candidate.enabled?'启用 / 调整时间':'保存未启用安排')+'：'+strategyRange(s)+'；原安排 '+previous+(candidate.enabled&&candidate.periodReconfirmed?'；已逐项复核并重新确认新时段价格与条件':''));}
 strategyPending=null;save();closeDialog();view.page='strategies';render();toast('策略安排已保存；原系统仍需人工落实与核验。');
}
function strategyStop(qi,id){const s=strategyFind(qi,id);if(!s||!s.enabled||strategyIsHistory(s))return;strategyEditor={qi,id};openDialog('strategy-stop','停用报价策略',`<p>${quotes[qi].name} · ${esc(s.name)}</p><p style="margin-top:12px">${strategyStatus(s)==='生效中'?'确认后立即停止生效':'确认后取消计划启用'}。历史价格与生效记录保留，不自动切换至其他策略。</p>`,cancel+'<button class="btn primary" data-strategy-action="stop-confirm">确认停用</button>');}
function strategyStopConfirm(){if(!strategyEditor)return;const s=strategyFind(strategyEditor.qi,strategyEditor.id);if(!s||!s.enabled)return;if(strategyIsHistory(s)){closeDialog();render();toast('该策略已结束，保留原结束时间。');return;}s.stoppedAt=strategyInput(strategyClock());s.enabled=false;strategyEvent(s,'手动停用；原安排 '+strategyDate(s.start)+' → '+strategyDate(s.end));save();closeDialog();render();toast('已停用，历史记录保留。');}
function strategyClone(qi,id){const s=strategyFind(qi,id);if(!s)return;const clone=strategyCopy(s);clone.id='copy-'+Date.now()+'-'+qi;clone.name=s.name+' · 副本';clone.start='';clone.end='';clone.enabled=false;delete clone.stoppedAt;delete clone.periodAcceptance;delete clone.periodReconfirmed;clone.events=[{at:strategyInput(strategyClock()),text:'复制自「'+s.name+'」，价格快照不变，需重新核对生效条件'}];books[qi].strategies.push(clone);save();closeDialog();view.page='strategies';render();strategyEdit(qi,clone.id);}
document.addEventListener('click',event=>{
 const el=event.target.closest('button');if(!el)return;
 if(el.dataset.strategyFilter){view.strategyFilter=el.dataset.strategyFilter;renderStrategiesPage();return;}
 if(el.dataset.strategyContinue!==undefined){view.page='chat';switchQuote(+el.dataset.strategyContinue);return;}
 const qi=Number(el.dataset.sq);
 if(el.dataset.strategyDetail){strategyDetail(qi,el.dataset.strategyDetail);return;}
 if(el.dataset.strategyEdit){strategyEdit(qi,el.dataset.strategyEdit);return;}
 if(el.dataset.strategyStop){strategyStop(qi,el.dataset.strategyStop);return;}
 if(el.dataset.strategyCopy){strategyClone(qi,el.dataset.strategyCopy);return;}
 const actions={name:()=>strategyNameDialog(),'save-name':saveStrategyName,'start-now':()=>{strategyEditor.startNow=true;$('#strategy-start').value=strategyInput(strategyClock());if(strategyTime($('#strategy-end').value)<=strategyClock())$('#strategy-end').value=strategyInput(strategyClock()+7*86400000);updateStrategyRenewal();},'save-schedule':saveStrategySchedule,'commit-schedule':commitStrategySchedule,'stop-confirm':strategyStopConfirm};actions[el.dataset.strategyAction]?.();
});
document.addEventListener('change',event=>{if(event.target.id==='strategy-customer'){view.strategyCustomer=event.target.value;renderStrategiesPage();}if(event.target.id==='strategy-start'&&strategyEditor)strategyEditor.startNow=false;if(['strategy-start','strategy-end'].includes(event.target.id))updateStrategyRenewal();});
ensureStrategies();save();
setInterval(()=>{if(view.page==='strategies'&&$('#dialog-cover').hidden)renderStrategiesPage();},30000);

render();
})();

</script>
</body></html>
