  <template id="pageSpec">
  <h3>页面目标</h3>
  <p>模拟司机、客户或业务人员通过群聊或人工入口提交一张销售回单。</p>
  <h3>字段与业务含义</h3>
  <ul><li>客户：选择客户来源时由左侧列表确定；选择群聊来源时，在输入区底部显示客户下拉，用于指定群聊对应客户。</li><li>来源类型：客户或群聊，决定回单归属与候选订单范围。</li><li>回单文字：与附件至少填写一种。</li><li>附件：支持 JPG、PNG、PDF、Excel；多个附件属于同一张回单。</li><li>发送人和发送时间：由来源消息自动生成。</li></ul>
  <h3>交互与业务规则</h3>
  <ul><li>客户模式不显示客户下拉；群聊模式显示紧凑客户下拉。</li><li>群聊模式下未选择群聊或对应客户时禁止发送。</li><li>空文字且无附件时禁止发送。</li><li>发送成功后只创建一张识别中任务，避免重复点击生成多张任务。</li><li>AI 识别结束后，需人工处理的数据进入待处理；识别中任务不进入回单任务列表。</li></ul>
  <h3>异常与恢复</h3><p>不支持的文件类型被忽略并提示；本原型只模拟文件接收，不向外部系统上传。</p>
</template>
