  <template id="pageSpec">
  <h3>页面目标</h3>
  <p>按操作员统计回单提交规模与覆盖商户数。</p>
  <h3>字段与业务含义</h3>
  <ul><li>处理商户数：统计周期内该操作员提交过回单的去重商户数。</li><li>提交回单数：统计周期内由该操作员确认提交成功的回单数。</li><li>提交商品数：上述已提交回单内的商品行总数。</li></ul>
  <h3>交互与业务规则</h3>
  <ul><li>三个指标使用相同时间范围和数据权限。</li><li>处理商户数按商户唯一标识去重；同一商户多张回单只计 1 个商户。</li><li>仅确认提交成功的数据计入提交回单数和提交商品数。</li></ul>

</template>
