  <template id="pageSpec">
  <h3>页面目标</h3>
  <p>维护回单来源群、绑定商户、机器人状态和识别开关。</p>
  <h3>字段与业务含义</h3>
  <ul><li>绑定商户：限定该群回单匹配销售订单的商户范围。</li><li>机器人状态：消息接收通道当前是否在线。</li><li>待处理：该群产生且仍需人工处理的任务数。</li></ul>
  <h3>交互与业务规则</h3>
  <ul><li>一个商户可以绑定多个群聊。</li><li>未绑定商户或机器人离线时不自动处理回单。</li><li>关闭识别开关不删除历史任务。</li></ul>

</template>

      <div class="modal-backdrop" id="bindGroup"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><span>绑定回单群聊</span><button class="modal-close" type="button" data-close-modal>×</button></div><div class="modal-body"><div class="grid two"><label class="field"><span>群聊</span><select><option>西郊中心幼儿园收货群</option><option>请选择群聊</option></select></label><label class="field"><span>绑定商户</span><select><option>西郊中心幼儿园</option><option>华南鲜食店</option></select></label><label class="field"><span>回单处理人</span><select><option>王明</option><option>赵倩</option></select></label><label class="field"><span>识别开关</span><select><option>开启</option><option>关闭</option></select></label></div></div><div class="modal-foot"><button class="btn" type="button" data-close-modal>取消</button><button class="btn primary" type="button" data-close-modal data-toast="群聊绑定已保存">确定</button></div></div></div>
