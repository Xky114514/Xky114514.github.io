<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录｜观麦 AI 智能订单助手</title><style>
:root{--primary:#1677ff;--primary2:#0363ff;--bg:#f5f5f5;--card:#fff;--line:#f0f0f0;--text:rgba(0,0,0,.88);--muted:rgba(0,0,0,.45);--sub:rgba(0,0,0,.65);--success:#52c41a;--warn:#faad14;--danger:#ff4d4f;--nav:#001529;--shadow:0 1px 4px rgba(0,0,0,.04)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--text);font-size:14px;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{height:100vh;display:flex;overflow:hidden}.sider{width:52px;flex:0 0 52px;background:var(--nav);color:#fff;overflow:hidden}.brand{height:40px;display:grid;place-items:center;font-weight:700;font-size:14px}.nav{padding-top:4px}.nav a{height:52px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.76);text-decoration:none;position:relative;margin:4px 0}.nav a:hover,.nav a.active{color:#fff;background:var(--primary)}.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}.nav a span{display:none}.nav a:hover:after{content:attr(data-title);position:fixed;left:58px;background:#222;color:#fff;padding:5px 9px;border-radius:4px;font-size:12px;z-index:30;white-space:nowrap}.workspace{min-width:0;flex:1;display:flex;flex-direction:column}.header{height:40px;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex:0 0 40px}.header .merchant{font-size:13px;font-weight:600}.header-actions{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}.icon-btn{border:0;background:transparent;color:var(--sub);padding:5px;border-radius:5px}.icon-btn:hover{background:#f5f5f5;color:var(--primary)}.tabbar{height:28px;background:#fff;display:flex;align-items:flex-end;flex:0 0 28px;overflow-x:auto}.route-tab{height:28px;padding:4px 10px;color:#707070;border:0;background:#fff;white-space:nowrap;font-size:13px}.route-tab.active{color:var(--primary2);background:#f5f5f5;border:1px solid var(--line);border-bottom-color:#f5f5f5;border-radius:6px 6px 0 0}.content{padding:12px;overflow:auto;min-height:0;flex:1}.page{max-width:1600px;margin:auto}.page-title{display:flex;align-items:flex-start;justify-content:space-between;margin:0 0 14px}.page-title h1{font-size:20px;margin:0;line-height:30px}.page-title p{margin:3px 0 0;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);margin-bottom:12px}.card-head{min-height:46px;padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}.card-body{padding:16px}.card.flat{box-shadow:none}.grid{display:grid;gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}.metric{padding:18px;background:#fff;border:1px solid var(--line);border-radius:8px}.metric-label{font-size:13px;color:var(--sub);margin-bottom:10px}.metric-value{font-size:28px;font-weight:700;line-height:1;color:#1f1f1f}.metric-note{color:var(--muted);font-size:12px;margin-top:8px}.blue{color:var(--primary)!important}.green{color:var(--success)!important}.orange{color:var(--warn)!important}.red{color:var(--danger)!important}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar.right{justify-content:flex-end}.control{height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:4px 10px;background:#fff;color:var(--text);min-width:120px;outline:none}.control:focus{border-color:#4096ff;box-shadow:0 0 0 2px rgba(5,145,255,.1)}textarea.control{height:auto;min-height:90px;resize:vertical}.search{min-width:240px}.btn{height:32px;border:1px solid #d9d9d9;background:#fff;border-radius:6px;padding:4px 14px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{border-color:#4096ff;color:#1677ff}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:#4096ff;color:#fff}.btn.danger{color:var(--danger);border-color:#ffccc7}.btn.link{border:0;background:transparent;color:var(--primary);padding:2px 6px;height:auto}.btn.dashed{border-style:dashed}.btn.small{height:26px;font-size:12px;padding:2px 9px}.btn.block{width:100%}.tag{display:inline-block;padding:1px 7px;border-radius:4px;background:#f5f5f5;color:var(--sub);font-size:12px;line-height:20px;white-space:nowrap}.tag.blue{background:#e6f4ff}.tag.green{background:#f6ffed}.tag.orange{background:#fff7e6}.tag.red{background:#fff2f0}.tag.purple{background:#f9f0ff;color:#722ed1}.tag.cyan{background:#e6fffb;color:#08979c}.switch{width:34px;height:18px;border-radius:9px;background:#bfbfbf;border:0;position:relative;vertical-align:middle;padding:0}.switch:before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}.switch.on{background:var(--primary)}.switch.on:before{left:18px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{background:#fafafa;color:var(--sub);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:hover td{background:#fafafa}.table .mono{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--sub)}.table .strong{font-weight:600}.empty{text-align:center;color:var(--muted);padding:42px}.pager{display:flex;justify-content:flex-end;gap:6px;padding:12px 0 0}.pager button{width:30px;height:30px;border:1px solid #d9d9d9;border-radius:6px;background:#fff}.pager button.active{border-color:var(--primary);color:var(--primary)}
.proto-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.proto-tab{padding:10px 16px;border:0;background:transparent;color:var(--sub);position:relative;white-space:nowrap}.proto-tab.active{color:var(--primary)}.proto-tab.active:after{content:"";height:2px;background:var(--primary);position:absolute;left:10px;right:10px;bottom:-1px}.tab-panel{display:none}.tab-panel.active{display:block}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--sub)}.field label.required:before{content:"*";color:var(--danger);margin-right:4px}.field .control{width:100%}.help{font-size:12px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:16px 0}.alert{border:1px solid #91caff;background:#e6f4ff;border-radius:8px;padding:10px 14px;color:#0958d9;margin-bottom:12px}.alert.warn{background:#fffbe6;border-color:#ffe58f;color:#ad6800}.alert.danger{background:#fff2f0;border-color:#ffccc7;color:#cf1322}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(680px,96vw);max-height:90vh;background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.2);display:flex;flex-direction:column}.modal.wide{width:min(1060px,96vw)}.modal-head{padding:15px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;display:flex;justify-content:space-between}.modal-body{padding:20px;overflow:auto}.modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:transparent;font-size:20px;color:var(--muted)}.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-15px);background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:10px 18px;opacity:0;pointer-events:none;transition:.25s;z-index:200}.toast.show{opacity:1;transform:translate(-50%,0)}
.progress{height:7px;background:#f0f0f0;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary);border-radius:4px}.section-title{display:flex;align-items:baseline;gap:10px;margin:24px 0 12px}.section-title b{font-size:25px;color:#d9d9d9}.section-title h2{font-size:18px;margin:0}.section-title span{color:var(--muted)}.chart{height:230px;position:relative;background:linear-gradient(#fff,#fff),repeating-linear-gradient(to bottom,transparent 0,transparent 45px,#f0f0f0 46px);border-left:1px solid #ddd;border-bottom:1px solid #ddd;overflow:hidden}.chart svg{width:100%;height:100%}.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
.chat-layout{height:calc(100vh - 68px);display:grid;grid-template-columns:270px minmax(420px,1fr) 320px;background:#fff}.chat-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.chat-side-head{padding:14px;border-bottom:1px solid var(--line)}.conversation{padding:12px 14px;border-bottom:1px solid #fafafa;cursor:pointer}.conversation.active{background:#e6f4ff}.conversation-title{font-weight:600;display:flex;justify-content:space-between}.conversation-preview{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-main{display:flex;flex-direction:column;min-width:0}.chat-head{height:52px;border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;justify-content:space-between}.messages{flex:1;padding:18px;overflow:auto;background:#f7f8fa}.bubble{max-width:72%;padding:9px 12px;border-radius:8px;background:#fff;margin:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}.bubble.me{margin-left:auto;background:#95ec69}.bubble .time{font-size:10px;color:var(--muted);margin-top:5px}.composer{padding:12px;border-top:1px solid var(--line);background:#fff}.composer textarea{width:100%;height:72px;border:0;resize:none;outline:none}.chat-info{border-left:1px solid var(--line);padding:16px;overflow:auto}.review-card{border:1px solid var(--line);border-radius:8px;margin-top:12px}.review-card h4{margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.login-page{min-height:100vh;background:#eef3ff center/cover no-repeat;display:flex;align-items:center;padding:32px 8%;position:relative;overflow:hidden}.login-brand{position:absolute;left:3%;top:6%;width:180px}.login-left{width:55%;padding-left:4%;z-index:1}.slogan{font-size:52px;font-weight:800;letter-spacing:4px;background:linear-gradient(90deg,#16d9d0,#1266dd,#8b28e8);-webkit-background-clip:text;color:transparent;margin:0 0 12px}.login-sub{font-size:20px;margin-bottom:36px}.feature{display:flex;gap:14px;align-items:center;margin:20px 0}.feature-ico{width:44px;height:44px;background:#fff;border-radius:10px;display:grid;place-items:center;font-size:22px}.login-card{width:400px;background:rgba(255,255,255,.96);padding:56px 60px;border:1px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:0 18px 50px rgba(70,90,160,.18);z-index:1}.login-card h2{text-align:center;margin:0 0 8px}.login-card .subtitle{text-align:center;color:#aaa;margin-bottom:32px}.login-card .control{height:48px;margin-bottom:18px;border-radius:10px}.login-card .btn{height:48px;border-radius:10px;font-weight:600;background:linear-gradient(100deg,#3f8cff,#7a24f6);border:0}.login-foot{text-align:center;color:#bbb;font-size:12px;margin-top:30px}
.report{max-width:1440px;margin:auto;background:#f5f5f5}.report-hero{background:linear-gradient(120deg,#14213d,#204e96);color:#fff;padding:26px;border-radius:10px;margin-bottom:16px}.report-hero h1{margin:0 0 5px}.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#eee}.rank.top{background:#faad14;color:#fff}.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.app-card{padding:20px;border-radius:12px;background:#fff;border:1px solid var(--line);text-align:center;cursor:pointer}.app-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}.app-ico{width:50px;height:50px;border-radius:14px;margin:0 auto 10px;display:grid;place-items:center;color:#fff;font-size:24px}.dashboard-banner{padding:22px 26px;border-radius:12px;background:linear-gradient(120deg,#eef4ff,#fff);margin-bottom:16px}.dashboard-banner h1{margin:0 0 8px;font-size:23px}
@media(max-width:900px){.grid.five,.grid.four,.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.chat-layout{grid-template-columns:220px 1fr}.chat-info{display:none}.login-left{display:none}.login-page{justify-content:center}.login-card{width:min(420px,92vw)}.app-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.sider{display:none}.content{padding:8px}.header{padding:0 8px}.grid.five,.grid.four,.grid.three,.grid.two{grid-template-columns:1fr}.metric-value{font-size:24px}.chat-layout{grid-template-columns:1fr}.chat-side{display:none}.login-card{padding:42px 28px}.table{min-width:680px}}
